services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
    - -hf
    - bartowski/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M
    - --host
    - 0.0.0.0
    - --port
    - '8080'
    - -c
    - '16384'
    - --parallel
    - '2'
    - -t
    - '4'
    - --jinja
    ports:
    - "8081:8080"
    environment:
      LLAMA_CACHE: /models
    volumes:
    - llamacpp-models:/models
    networks:
    - llmnet
    restart: unless-stopped
volumes:
  llamacpp-models: null
